services:
  app:
    build:
      context: .
      args:
        DATABASE_URL: ${DATABASE_URL}
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - media-data:/app/public/media

volumes:
  media-data:
